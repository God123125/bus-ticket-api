<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Telegram Link QR Test</title>
    <style>
      body {
        font-family: sans-serif;
        max-width: 420px;
        margin: 60px auto;
        text-align: center;
      }
      img {
        border: 1px solid #ccc;
        margin-top: 16px;
      }
      input,
      button {
        padding: 8px;
        font-size: 14px;
      }
      #status {
        margin-top: 12px;
        color: #555;
      }
    </style>
  </head>
  <body>
    <h2>Telegram Link QR Test</h2>

    <input
      id="userId"
      type="text"
      placeholder="Enter userId"
      value="TEST_USER_123"
    />
    <button id="generateBtn">Generate QR</button>

    <div id="status"></div>
    <img id="qrImage" style="display: none" width="300" height="300" />

    <script>
      // Point this at your local backend
      const API_BASE = "http://localhost:3000/api/telegram";

      const generateBtn = document.getElementById("generateBtn");
      const userIdInput = document.getElementById("userId");
      const qrImage = document.getElementById("qrImage");
      const status = document.getElementById("status");

      generateBtn.addEventListener("click", async () => {
        const userId = userIdInput.value.trim();
        if (!userId) return;

        status.textContent = "Generating...";
        qrImage.style.display = "none";

        try {
          const res = await fetch(`${API_BASE}/link-qr/${userId}`);
          if (!res.ok) throw new Error(`HTTP ${res.status}`);

          const data = await res.json();
          qrImage.src = data.qrDataUrl; // already a base64 data URL — assign directly
          qrImage.style.display = "block";
          status.textContent = `Scan with Telegram. Expires in ${data.expiresInMinutes} min.`;
        } catch (err) {
          status.textContent = "Error: " + err.message;
          console.error(err);
        }
      });
    </script>
  </body>
</html>
